name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      cache: true
      sanitize: true

  test:
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
